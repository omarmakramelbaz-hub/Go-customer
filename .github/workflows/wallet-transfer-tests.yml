name: Wallet destination checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/view/layout/wallet test/wallet_transfer_test.dart test/wallet_loading_test.dart test/wallet_login_web_test.dart
      - run: flutter test test/wallet_transfer_test.dart test/wallet_loading_test.dart
      - run: flutter test --platform chrome test/wallet_login_web_test.dart
