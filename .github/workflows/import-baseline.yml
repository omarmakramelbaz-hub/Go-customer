name: Import Go Drive baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout standalone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Fasakhansta Customer baseline
        run: |
          rm -rf /tmp/fasakhansta-customer
          git clone --depth 1 https://github.com/omarmakramelbaz-hub/fasakhansta-customer.git /tmp/fasakhansta-customer
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='android/app/FaskhaNinja-keystore.jks' \
            --exclude='android/key.properties' \
            /tmp/fasakhansta-customer/ ./

      - name: Preserve standalone identity notes
        run: |
          cat > STANDALONE.md <<'EOF'
          # Go Drive Customer standalone
          This repository is an independent baseline copied from Fasakhansta Customer.
          The original Fasakhansta Customer repository remains unchanged and continues to include Go Drive.
          Standalone target: Go Drive / com.fasakhansta.godrive.customer
          Primary feature: lib/view/layout/request_delegate
          EOF

      - name: Commit imported baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No baseline changes to commit.'
          else
            git commit -m 'Import Flutter baseline for standalone Go Drive customer'
            git push origin HEAD:main
          fi
