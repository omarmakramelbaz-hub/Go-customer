name: Go Drive Web Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: go-drive-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check standalone boundaries
        run: dart run tool/check_standalone.dart
      - name: Configure browser integrations
        env:
          MAPS_WEB_API_KEY: ${{ vars.MAPS_WEB_API_KEY }}
        run: python3 tool/configure_web.py
      - name: Compile web preview
        env:
          MAPS_WEB_API_KEY: ${{ vars.MAPS_WEB_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
        run: |
          flutter build web --release --no-web-resources-cdn \
            --base-href /${{ github.event.repository.name }}/ \
            --dart-define=MAPS_WEB_API_KEY="$MAPS_WEB_API_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FACEBOOK_APP_ID="$FACEBOOK_APP_ID"
      - name: Upload downloadable web build
        uses: actions/upload-artifact@v4
        with:
          name: go-drive-web-${{ github.run_attempt }}
          path: build/web
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
