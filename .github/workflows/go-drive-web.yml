name: Go Drive Web Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: go-drive-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify approved identity and active home route
        run: python3 tool/verify_approved_identity.py
      - name: Verify store images on a cross-origin host without CORS
        run: |
          python3 -m http.server 8931 --bind 127.0.0.1 --directory assets/brand > /tmp/go-store-image-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          flutter test --platform chrome --dart-define=GO_STORE_IMAGE_TEST_URL=http://127.0.0.1:8931/go_home_wallet.webp test/go_store_images_web_test.dart
      - name: Test approved identity and customer legal pages
        run: flutter test test/go_customer_identity_test.dart test/go_customer_legal_test.dart test/go_auth_ui_test.dart test/go_home_commerce_test.dart test/go_home_wallet_test.dart test/go_store_signup_test.dart test/go_app_fixes_test.dart test/go_store_browse_test.dart test/go_store_checkout_test.dart
      - name: Upload actual Flutter UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-customer-ui-preview
          path: build/ui-preview
          if-no-files-found: ignore
      - name: Analyze store signup and email verification
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/go_stores lib/view/layout/address lib/view/layout/cart lib/view/layout/request_delegate lib/go_store_signup lib/helpers/networking/partner_email_auth.dart lib/view/layout/partner_application/screen/partner_application_screen.dart test/go_store_signup_test.dart test/go_app_fixes_test.dart test/go_store_browse_test.dart test/go_store_checkout_test.dart
      - name: Check standalone boundaries
        run: dart run tool/check_standalone.dart
      - name: Configure browser integrations
        env:
          MAPS_WEB_API_KEY: ${{ vars.MAPS_WEB_API_KEY }}
        run: python3 tool/configure_web.py
      - name: Compile web preview
        env:
          MAPS_WEB_API_KEY: ${{ vars.MAPS_WEB_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
        run: |
          flutter build web --release --no-web-resources-cdn \
            --base-href /${{ github.event.repository.name }}/ \
            --dart-define=MAPS_WEB_API_KEY="$MAPS_WEB_API_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FACEBOOK_APP_ID="$FACEBOOK_APP_ID"
      - name: Stamp published identity revision
        run: python3 tool/stamp_web_identity.py
      - name: Upload downloadable web build
        uses: actions/upload-artifact@v4
        with:
          name: go-drive-web-${{ github.run_attempt }}
          path: build/web
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
