<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">

  <meta name="description" content="GO — كل الخدمات عندك. اطلب مندوب أو مقدم خدمة وتابع طلبك.">
  <meta name="theme-color" content="#171a1f">
  <meta name="apple-mobile-web-app-title" content="GO">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=partner-ui-20260927">
  <link rel="manifest" href="manifest.json">
  <title>Go Customer</title>
  <style>
    @font-face{font-family:Tajawal;src:url(assets/assets/font/Tajawal/Tajawal-Bold.ttf)}
    html,body{margin:0;background:#171a1f;min-height:100%;font-family:Tajawal,Arial,sans-serif}
    #loading{position:fixed;inset:0;overflow:hidden;text-align:center;color:#fff;
      background:#171a1f url(assets/assets/brand/partner_splash.webp) center/cover}
    #loading .brand{position:absolute;top:24%;left:28px;right:28px;transform:translateY(-24%);

    #loading strong{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
    #loading strong::before,#loading strong::after{content:"";width:23px;height:3px;background:#fd7201}
    noscript{position:fixed;inset:auto 20px 28px;text-align:center;color:#fff;font-size:14px;z-index:2}

  <!-- MAPS_SCRIPT -->
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>

<body>
  <div id="loading" role="status" aria-label="GO">

    </div>
  </div>
  <noscript>يرجى تفعيل JavaScript لفتح التطبيق.</noscript>
  <script>window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());</script>
